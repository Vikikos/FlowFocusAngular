<div class="bubble-element rounded-2 p-4 h-100">
    @if(note$ | async; as note){
    <div class="border-bottom pb-2 d-flex flex-row justify-content-between align-items-center">
        <div>
            <h3 class="m-0">{{ note.title }}</h3>
        </div>
        <div>
            <button class="bg-transparent border-0" (click)="notifyClose()">
                <i class="bi bi-x-circle fs-5"></i>
            </button>
        </div>
    </div>
    <div class="border-bottom">
        <span class="fw-bold">Fecha de creacion:</span>
        {{ note.date }}
    </div>

    <p class="py-2 overflow-auto">
        {{ note.content }}
    </p>
    } @else {
    <div>Cargando datos...</div>
    }
</div>
