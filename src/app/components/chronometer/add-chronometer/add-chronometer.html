<form class="bubble-element rounded-2 p-4">
    <h2>Nuevo Cronometro</h2>
    <div class="form-group mb-3">
        <label for="name">Nombre </label>
        <input type="name" class="form-control" placeholder="ejemplo@ejemplo.com" name="email">
        @if(validateField('email')){
                <small class="form-text text-danger">El email es obligatorio y debe tener un formato correcto</small>
            }
    </div>
    <div class="form-group mb-3">
        <label for="duration">Duracion </label>
        <input type="duration" class="form-control" placeholder="ejemplo@ejemplo.com" name="email">
        @if(validateField('email')){
                <small class="form-text text-danger">El email es obligatorio y debe tener un formato correcto</small>
            }
    </div>
    <div class="form-group mb-3">
        <label for="direction">Sentido </label>
        <input type="direction" class="form-control" placeholder="ejemplo@ejemplo.com" name="email">
        @if(validateField('email')){
                <small class="form-text text-danger">El email es obligatorio y debe tener un formato correcto</small>
            }
    </div>
</form>
