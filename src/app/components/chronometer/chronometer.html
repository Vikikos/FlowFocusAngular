
        <div class="container">
            <div class="row">
            <div class="col-12 col-lg-6">
                
                    @for (chronometer of chronometers$ | async; track $index) {
                        <detail-chronometer 
                            (deleted)="getChronometers()" 
                            (updated)="getChronometers()" 
                            [id]="chronometer.id!"
                            class="py-2 d-block"
                        ></detail-chronometer>
                    } @empty {
                        <div>No tienes cronometros guardados</div>
                    }

            </div>
            <div class="col-12 col-lg-6">
                <add-chronometer (added)="getChronometers()"></add-chronometer>
            </div>
        </div>
        </div>
