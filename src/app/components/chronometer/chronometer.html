<div class="d-flex flex-row">
    <aside-menu-component></aside-menu-component>
    <main class="w-100 p-4 p-lg-5">
        <div class="container">
            <div class="row">
            <div class="col-12 col-lg-6">
                
                    @for (chronometer of chronometers$ | async; track $index) {
                        <detail-chronometer 
                            (deleted)="getChronometers()" 
                            (updated)="getChronometers()" 
                            [idChoronometer]="chronometer.id!"
                        ></detail-chronometer>
                    } @empty {
                        <div>No tienes cronometros guardados</div>
                    }

            </div>
            <div class="col-12 col-lg-6">
                <add-chronometer (added)="getChronometers()"></add-chronometer>
            </div>
        </div>
        </div>
    </main>
</div>
