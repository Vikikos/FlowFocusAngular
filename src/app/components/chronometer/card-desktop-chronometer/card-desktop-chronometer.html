
    <div class="bubble-element rounded-2 py-2 px-3 h-100 d-flex flex-column">
        @if(chronometer$ | async; as chronometer){
            <div class="border-bottom fw-bold d-flex flex-row justify-content-between align-items-center">
                <h3 class="fs-5">{{ chronometer.name }}</h3>
                <div>
                    <button class="bg-transparent border-0" (click)="notifyClose()">
                        <i class="bi bi-x-circle fs-5"></i>
                    </button>
                </div>
            </div>
        } @else {
            <div class="border-bottom fw-bold">
                <h3 class="fs-5">cargando cronometro...</h3>
            </div>
        }
        <div class="d-flex flex-column justify-content-center flex-grow-1">
           <div class="fs-1 text-center">
                {{ tiempoDisplay() }}
            </div>
            <div class="d-flex justify-content-center">
                @if (!corriendo()) {
                <button class="btn iniciar" (click)="iniciar()">
                    <i class="bi bi-play-circle-fill fs-2"></i>
                </button>
                } @else {
                <button class="btn" (click)="pausar()">
                    <i class="bi bi-pause-circle-fill fs-2"></i>
                </button>
                }
                <button class="btn" (click)="reiniciar()">
                    <i class="bi bi-stop-circle fs-2"></i>
                </button>
            </div> 
        </div>
        
    </div>
