
    <div class="container-fluid h-100">
      <div class="row h-100 g-2 max-grid">
        @for (space of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track space) {
          <div class="col-12 col-sm-6 col-lg-4 grid-child">
            @if (getSpace(space)) {
              <ng-container 
                *ngComponentOutlet="getSpace(space).component; inputs: getSpace(space).inputs"
              >
              </ng-container>
            } @else {
              <button class="btn w-100 h-100" (click)="selectFunction(space)">
                <i class="bi bi-plus-circle fs-2 text-center"></i>
              </button>
            }
          </div>
        }
      </div>
    </div>
