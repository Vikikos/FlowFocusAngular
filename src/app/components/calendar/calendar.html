<div class="d-flex flex-row">
    <aside-menu-component></aside-menu-component>
    <main class="w-100 p-3 p-lg-5">
        <div class="container">
            <div class="row">
            <div class="col-12 col-lg-6">
                @if(calendars$ | async; as calendars){
                     @for (chronometer of calendars; track $index) {
                        <card-calendar></card-calendar>
                        <!-- <detail-chronometer (deleted)="getChronometers()" (updated)="getChronometers()" [idChoronometer]="chronometer.id!"></detail-chronometer> -->
                    }
                } @else {
                    <div>No tienes calendarios guardados</div>
                }
            </div>
            <div class="col-12 col-lg-6">
                <add-calendar (added)="addCalendar()"></add-calendar>
            </div>
        </div>
        </div>
    </main>
</div>
