<div class="py-2">
  <div class="bubble-element rounded-2 py-2 px-3">
    @if(calendar$ | async; as calendar){
      <div class="border-bottom fw-bold d-flex flex-row justify-content-between align-items-center">
        <h3 class="fs-5">{{ calendar.name }}</h3>
        <div>
          <button class="bg-transparent border-0" (click)="editCalendar(calendar)">
            <i class="bi bi-pencil-square fs-4"></i>
          </button>
          <button class="bg-transparent border-0" (click)="deleteCalendar()">
            <i class="bi bi-trash fs-4"></i>
          </button>
        </div>
      </div>
      <div class="d-flex flex-column py-2">
        <div class="py-2 pe-2">
          <span>Tipo de vista: </span>
          {{ VIEWS[calendar.view_calendar] }}
        </div>
        <button 
          (click)="showCalendar(calendar.id!)" 
          class="btn btn-primary"
        > Ver calendario</button>
      </div>
    }
  </div>
</div>
