<form 
    class="bubble-element rounded-2 p-4 my-2" 
    [formGroup]="calendarForm"
    (ngSubmit)="addCalendar()"
>
    <h2 class="mb-4">Nuevo Calendario</h2>
    <div class="form-group mb-3">
        <label for="name" class="form-label fw-bold">Nombre </label>
        <input 
            type="name" 
            class="form-control" 
            placeholder="Calendario de trabajo" 
            name="name"
            formControlName="name"
        >
        @if(validateField('name')){
            <small class="form-text text-danger">El nombre es obligatorio</small>
        }
    </div>
    <div class="form-group mb-3">
        <label for="view" class="form-label fw-bold">Vista </label>
        <select class="form-select" name="view" formControlName="view">
            <option selected>Selecciona la Vista</option>
            <option value="multiMonthYear">Vista Año</option>
            <option value="dayGridMonth">Vista Mes</option>
            <option value="timeGridWeek">Vista Semana</option>
            <option value="timeGridDay">Vista Dia</option>
        </select>
        @if(validateField('view')){
            <small class="form-text text-danger">Debes seleccionar una opcion valida</small>
        }
    </div>
    <div>
        <button
            type="submit" 
            class="btn btn-primary mb-4 w-100 "
            [disabled]="calendarForm.invalid"
        >
            Añadir Calendario
        </button>
    </div>
    
</form>
