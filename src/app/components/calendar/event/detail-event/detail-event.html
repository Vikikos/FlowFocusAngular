<div class="bubble-element rounded-2 p-4">
    @if(event$ | async; as event) {
        <!-- el color de fondo del color del eb¡vento -->
        <div class="border-bottom d-flex flex-row justify-content-between align-items-center">
            <h2>{{ event.title }}</h2>
            <div>
                <button class="bg-transparent border-0" (click)="editEvent(event)">
                    <i class="bi bi-pencil-square fs-4"></i>
                </button>
                <button class="bg-transparent border-0" (click)="deleteEvent()">
                    <i class="bi bi-trash fs-4"></i>
                </button>
            </div>
        </div>
        <div class="mt-3">
            <div>
                <span class="fw-bold">Inicio:</span> 
                {{ event.start | date:'dd/MM/yyyy HH:mm' }}
            </div>
            <div>
                <span class="fw-bold">Fin:</span> 
                {{ event.end | date:'dd/MM/yyyy HH:mm' }}
            </div>
            <div>
                <span class="fw-bold">Duracion:</span> 
                {{ getDuration(event) | date:'HH:mm':'UTC'}}
            </div>
        </div>
    } @else {
        <div>Cargando evento...</div>
    }
 </div>
