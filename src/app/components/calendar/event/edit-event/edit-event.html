<form class="rounded-2 p-4 my-2" [formGroup]="formData" (ngSubmit)="updateEvent()">
    <div class="mb-4 d-flex flex-row align-items-center justify-content-between">
        <h2>Editar Evento</h2>
        <button 
            class="bg-transparent border-0 p-0" 
            (click)="closeDialog()"
        >
            <i class="bi bi-x-circle fs-3" []></i>
        </button>
    </div>
    <div class="form-group mb-3">
        <label for="title" class="form-label fw-bold">Nombre </label>
        <input type="text" class="form-control" [class.is-invalid]="validateField('title')" placeholder="Nombre del evento" name="title" formControlName="title">
        @if(validateField('title')){
            <small class="form-text text-danger">El titulo es obligatorio</small>
        }
    </div>
    <div class="form-group mb-3">
        <label for="date" class="form-label fw-bold">Dia </label>
        <input type="date" class="form-control" [class.is-invalid]="validateField('date')" name="date" formControlName="date">
        @if(validateField('date')){
            <small class="form-text text-danger">El dia es obligatorio</small>
        }
    </div>
    <div class="row mb-3">
        <div class="col-md-6 col-12 ">
            <label for="start" class="form-label fw-bold">Inicio</label>
            <input type="time" class="form-control" [class.is-invalid]="validateField('start')" name="start" formControlName="start">
            @if(validateField('start')){
                <small class="form-text text-danger">La hora de inicio es obligatoria</small>
            }
        </div>
        <div class="col-md-6 col-12">
            <label for="end" class="form-label fw-bold">Fin</label>
            <input type="time" class="form-control" [class.is-invalid]="validateField('end')" name="end" formControlName="end">
        </div>
    </div>
    <div class="form-group mb-3">
        <label for="color" class="form-label fw-bold">Sentido </label>
        <select class="form-select" name="color" formControlName="color">
            <option selected >Elige color</option>
            <option value="#6e7ed8" class="p-1 colorEvent1">Azul</option>
            <option value="#f77067" class="p-1 colorEvent2">Rojo</option>
            <option value="#6cc981" class="p-1 colorEvent3">Verde</option>
            <option value="#e6d27b" class="p-1 colorEvent4">Amarillo</option>
            <option value="#bb78c9" class="p-1 colorEvent5">Morado</option>
        </select>
        @if(validateField('color')){
            <small class="form-text text-danger">Debes seleccionar una opcion valida</small>
        }
    </div>
    <div class="pt-3">
        <button type="submit" class="btn btn-primary w-100" [disabled]="formData.invalid">
            Guardar Cambios
        </button>
    </div>
</form>
